name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Чистое C++-ядро: быстрые тесты с санитайзерами (без JUCE).
  core-tests-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests (ASan+UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -ISource tests/test_dsp.cpp -o dsp_tests
          ./dsp_tests
      - name: Engine tests (ASan+UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -ISource \
              tests/test_engine.cpp Source/Engine/RadioEngine.cpp Source/Stations/StationPrep.cpp -o engine_tests
          ./engine_tests
      - name: UI model tests
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -ISource tests/test_ui_model.cpp -o ui_tests
          ./ui_tests
      - name: Preset tests (ASan+UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -ISource \
              tests/test_presets.cpp Source/Engine/RadioEngine.cpp Source/Stations/StationPrep.cpp -o preset_tests
          ./preset_tests

  # Windows x64 VST3 (JUCE подтягивается через FetchContent, нужен доступ к GitHub).
  windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build (Release)
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: List VST3 output
        shell: pwsh
        run: Get-ChildItem -Recurse build -Filter *.vst3 | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: FREQUENCY-vst3-win-x64
          path: build/Frequency_artefacts/Release/VST3/FREQUENCY.vst3
          if-no-files-found: error
